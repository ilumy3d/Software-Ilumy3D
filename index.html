<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilumy3D - Gestão de Impressão 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config/supabase.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shopee: '#EE4D2D',
                        ml: '#FFE600',
                        site: '#2563EB',
                        wts: '#25D366'
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .kanban-column {
            min-height: calc(100vh - 220px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- TELA DE LOGIN -->
    <div id="screen-login" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950">
        <div class="w-full max-w-md p-8 rounded-3xl glass-card shadow-2xl border border-slate-800 space-y-6 flex flex-col items-center">
            <div class="text-center space-y-3 w-full flex flex-col items-center">
                <!-- Ícone 3D Moderno em Vetor SVG -->
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 shadow-lg shadow-indigo-500/30">
                    <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021-16z"></path>
                        <polyline stroke-linecap="round" stroke-linejoin="round" points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line stroke-linecap="round" stroke-linejoin="round" x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight pt-1">Ilumy3D</h1>
            </div>

            <form onsubmit="fazerLogin(event); return false;" class="space-y-4 w-full">
                <div id="login-error" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold text-center"></div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail de Acesso</label>
                    <input type="email" id="login-email" required placeholder="seuemail@exemplo.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                    <input type="password" id="login-password" required placeholder="Digite sua senha" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/25 active:scale-98 flex items-center justify-center gap-2">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- ÁREA PROTEGIDA (APP PRINCIPAL) -->
    <div id="screen-app" class="hidden flex-1 flex flex-col">
        <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 shadow-md shadow-indigo-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021-16z"></path>
                            <polyline stroke-linecap="round" stroke-linejoin="round" points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line stroke-linecap="round" stroke-linejoin="round" x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white leading-none">Ilumy3D</h1>
                        <span class="text-[10px] text-slate-400">Painel Operacional</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <span id="user-display" class="text-xs text-slate-400 font-mono bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"></span>
                    <button onclick="fazerLogout()" class="text-xs font-semibold text-slate-400 hover:text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500/10 transition border border-transparent">
                        Sair
                    </button>
                </div>
            </div>
        </nav>

        <header class="p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div class="p-6 rounded-3xl glass-card border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-2xl">
                <div>
                    <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        Módulo 1 • Operacional
                    </span>
                    <h2 class="text-2xl font-extrabold text-white tracking-tight mt-1">Gestão de Pedidos</h2>
                    <p class="text-xs text-slate-400 mt-0.5" id="total-pedidos-text">Carregando fila...</p>
                </div>
                
                <button onclick="abrirModalNovoPedido()" class="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold px-6 py-3 rounded-2xl text-sm transition shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 active:scale-95">
                    + Novo Pedido
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full pt-0 overflow-x-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 min-w-[300px]">
                
                <!-- 1. NOVO PEDIDO -->
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 kanban-column">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> Novo Pedido
                        </span>
                        <span id="count-novo" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-bold">0</span>
                    </div>
                    <div id="coluna-novo" class="flex flex-col gap-3 flex-1"></div>
                </div>

                <!-- 2. EM PRODUÇÃO -->
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 kanban-column">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> Em Produção
                        </span>
                        <span id="count-producao" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-bold">0</span>
                    </div>
                    <div id="coluna-producao" class="flex flex-col gap-3 flex-1"></div>
                </div>

                <!-- 3. ACABAMENTO / EMBALAGEM -->
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 kanban-column">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-orange-500"></span> Acabamento / Embalagem
                        </span>
                        <span id="count-embalagem" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-bold">0</span>
                    </div>
                    <div id="coluna-embalagem" class="flex flex-col gap-3 flex-1"></div>
                </div>

                <!-- 4. AGUARDANDO ENVIO -->
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 kanban-column">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span> Aguardando Envio
                        </span>
                        <span id="count-envio" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-bold">0</span>
                    </div>
                    <div id="coluna-envio" class="flex flex-col gap-3 flex-1"></div>
                </div>

                <!-- 5. CONCLUÍDO -->
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 kanban-column">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Concluído
                        </span>
                        <span id="count-concluido" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-bold">0</span>
                    </div>
                    <div id="coluna-concluido" class="flex flex-col gap-3 flex-1"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL DE NOVO PEDIDO -->
    <div id="modal-novo-pedido" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">🛍️ Cadastrar Novo Pedido</h3>
                <button onclick="fecharModalNovoPedido()" class="text-slate-400 hover:text-white text-xl">✕</button>
            </div>

            <form onsubmit="salvarNovoPedido(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Canal de Venda *</label>
                    <select id="input-origem" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100">
                        <option value="Shopee">🟠 Shopee</option>
                        <option value="Mercado Livre">🟡 Mercado Livre</option>
                        <option value="Site Próprio">🌐 Site Próprio</option>
                        <option value="WhatsApp">🟢 WhatsApp / Venda Direta</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Selecione o Produto (Catálogo) *</label>
                    <select id="input-produto-sku" onchange="autoPreencherProduto()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100">
                        <option value="">-- Escolha um Produto --</option>
                        <option value="PRD-001">#PRD-001 - Suporte Headset PS5</option>
                        <option value="PRD-002">#PRD-002 - Vasinho Decorativo LowPoly</option>
                        <option value="PRD-003">#PRD-003 - Base Action Figure Diorama</option>
                        <option value="PRD-004">#PRD-004 - Engrenagem Personalizada</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Cliente *</label>
                        <input type="text" id="input-cliente" required placeholder="Ex: Ana Maria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Código do Pedido</label>
                        <input type="text" id="input-codigo" placeholder="Ex: #SHP-9821" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Valor Total (R$) *</label>
                    <input type="number" step="0.01" id="input-valor" required placeholder="45.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100">
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="fecharModalNovoPedido()" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs">Salvar Pedido</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CARREGAMENTO DOS MÓDULOS DE JAVASCRIPT ORGANIZADOS -->
    <script src="assets/js/modules/auth.js"></script>
    <script src="assets/js/modules/pedidos.js"></script>
</body>
</html>
